# Rebuilds the static site from the league sheet and publishes it to GitHub Pages.
# Pushes to any branch run the build as a check; only main publishes.
name: Publish site

on:
  push:
  schedule:
    # Every 15 minutes, off the top of the hour when GitHub's scheduler is busiest.
    # Scheduled runs only happen on the default branch.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      # A failed fetch or an unreadable sheet fails here, so the last good page stays up.
      - run: python build.py
        env:
          LEAGUE_SHEET_URL: ${{ vars.LEAGUE_SHEET_URL }}
          LEAGUE_TZ: ${{ vars.LEAGUE_TZ }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
